# ===================================
# HollowLight — Theme Config
# ===================================

# 博主信息
author:
  name: "Everlasting Elysium"
  avatar: /img/avatar.svg
  bio: "这里是我的博客"
  level: 1
  credit_score: 900

# 导航菜单
menu:
  推送: /
  归档: /archives/
  标签: /tags/
  相册: /album/
  伙伴: /friends/
  关于: /about/

# 社交链接（留空则不显示）
social:
  github: "https://github.com/Everlasting-Elysium"
  twitter: ""
  weibo: ""
  email: ""

# 背景图
background: ""   # 替换为你的背景图路径，如 /img/bg.png，留空则无背景

# 相册配置
album:
  data: source/_data/album.yml
  columns: 4

# 友链数据文件
friends_data: source/_data/friends.yml

# 代码高亮
highlight:
  theme: one-dark

# 评论（预留）
comment:
  enable: false
  type: ""

# 页脚
footer:
  since: 2022
  icp: ""

# 首页幕布
curtain:
  enable: true
  background:
    type: image
    url: ""        # 替换为幕布背景图路径，如 /img/curtain-bg.jpg
  typewriter:
    - "这里是我的博客"
    - "记录代码与生活"
    - "探索未知的边界"

# 本地搜索
search:
  enable: true
