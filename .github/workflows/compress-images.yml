name: Compress Album Images

on:
  workflow_dispatch:    # 支持手动触发（首次 / 补生成）
  push:
    branches: [main]
    paths:
      - 'source/img/**'

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false   # 不需要完整 submodule，脚本单独复制

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Generate thumbnails
        run: |
          node - <<'EOF'
          const sharp  = require('sharp')
          const fs     = require('fs')
          const path   = require('path')

          const IMG_DIR       = path.resolve('source/img')
          const THUMB_WIDTH   = 600
          const THUMB_QUALITY = 78
          const IMAGE_EXTS    = /\.(jpe?g|png|gif|webp|avif|tiff?)$/i

          function isThumb(name)         { return name.endsWith('.thumb.webp') }
          function thumbPathFor(srcPath) { return srcPath.replace(IMAGE_EXTS, '.thumb.webp') }
          function isUpToDate(src, thumb) {
            if (!fs.existsSync(thumb)) return false
            return fs.statSync(thumb).mtimeMs >= fs.statSync(src).mtimeMs
          }
          function walkImages(dir, results = []) {
            if (!fs.existsSync(dir)) return results
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory())                                        walkImages(full, results)
              else if (IMAGE_EXTS.test(entry.name) && !isThumb(entry.name)) results.push(full)
            }
            return results
          }

          ;(async () => {
            const images = walkImages(IMG_DIR)
            let generated = 0, skipped = 0
            for (const src of images) {
              const thumb = thumbPathFor(src)
              if (isUpToDate(src, thumb)) { skipped++; continue }
              try {
                await sharp(src)
                  .resize({ width: THUMB_WIDTH, withoutEnlargement: true })
                  .webp({ quality: THUMB_QUALITY })
                  .toFile(thumb)
                const sk = Math.round(fs.statSync(src).size   / 1024)
                const tk = Math.round(fs.statSync(thumb).size / 1024)
                console.log(`  ✓  ${path.relative(process.cwd(), src)}  ${sk}KB → ${tk}KB`)
                generated++
              } catch (e) { console.error(`  ✗  ${src}:`, e.message) }
            }
            console.log(`\nDone — ${generated} generated, ${skipped} up-to-date`)
          })()
          EOF

      - name: Commit thumbnails
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "source/img/**/*.thumb.webp" || true
          git diff --staged --quiet && echo "No new thumbnails." || \
            git commit -m "chore: auto-generate album thumbnails [skip ci]" && git push
